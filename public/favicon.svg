<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Emrah Yücel — the C2 surface reduced to its signature: rows of ink on paper, parted into one opening,
       with a single thread of project ink where the material gave way. Drawn on the 16px grid. -->
  <rect width="16" height="16" fill="#e7e6e0"/>
  <g fill="#121212">
    <rect y="1" width="16" height="1"/>
    <rect y="3" width="7" height="1"/><rect x="9" y="3" width="7" height="1"/>
    <rect y="5" width="5" height="1"/><rect x="11" y="5" width="5" height="1"/>
    <rect y="7" width="3" height="1"/><rect x="13" y="7" width="3" height="1"/>
    <rect y="9" width="3" height="1"/><rect x="13" y="9" width="3" height="1"/>
    <rect y="11" width="5" height="1"/><rect x="11" y="11" width="5" height="1"/>
    <rect y="13" width="7" height="1"/><rect x="9" y="13" width="7" height="1"/>
    <rect y="15" width="16" height="1"/>
  </g>
  <rect x="5" y="8" width="6" height="1" fill="#8e3a17"/>
</svg>
